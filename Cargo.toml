[workspace]
resolver = "3"
members = [
    "crates/lc-protocol",
    "crates/lc-net",
    "crates/lc-registry",
    "crates/lc-world",
    "crates/lc-render",
    "crates/lc-audio",
    "crates/lc-input",
    "crates/lc-ui",
    "crates/lc-launcher",
    "crates/lc-app",
    "xtask",
]
default-members = ["crates/lc-app"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.91"
publish = false
repository = "https://github.com/OHMYCODESAREPERFECT/legohans-client"

# Internal crates. Dependency direction (one way only):
#   lc-app -> lc-ui / lc-render / lc-input / lc-audio -> lc-world -> lc-protocol / lc-registry
[workspace.dependencies]
lc-protocol = { path = "crates/lc-protocol" }
lc-net = { path = "crates/lc-net" }
lc-registry = { path = "crates/lc-registry" }
lc-world = { path = "crates/lc-world" }
lc-render = { path = "crates/lc-render" }
lc-audio = { path = "crates/lc-audio" }
lc-input = { path = "crates/lc-input" }
lc-ui = { path = "crates/lc-ui" }
lc-launcher = { path = "crates/lc-launcher" }
# Third-party crates are added here, once, when a task actually needs them.
egui = { version = "0.33.3", default-features = false, features = ["default_fonts"] }
eframe = { version = "0.33.3", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
png = "0.18.1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
