
name: CI

on:
  push:
    branches: [main, task-002-launcher, task-003-customization]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all --check

  test:
    name: Clippy and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Run lc-app
        run: cargo run --locked -p lc-app -- --version

  build-windows:
    name: Build Windows launcher
    runs-on: windows-latest
    needs: [fmt, test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build launcher
        run: cargo build --release --locked -p lc-app --bins

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: legohans-client-windows
          path: |
            target/release/legohans-client.exe
            target/release/lc-app.exe
          if-no-files-found: error
