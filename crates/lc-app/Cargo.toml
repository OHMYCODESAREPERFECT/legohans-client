[package]
name = "lc-app"
description = "Legohan's Client: application entry points."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
default-run = "lc-app"
build = "build.rs"

[[bin]]
name = "lc-app"
path = "src/main.rs"

[[bin]]
name = "legohans-client"
path = "src/bin/legohans-client.rs"

[dependencies]
lc-protocol.workspace = true
lc-net.workspace = true
lc-registry.workspace = true
lc-world.workspace = true
lc-render.workspace = true
lc-audio.workspace = true
lc-input.workspace = true
lc-ui.workspace = true
lc-launcher.workspace = true

[target.'cfg(windows)'.build-dependencies]
png = "0.18.1"
winres = "0.1.12"

[lints]
workspace = true
